<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trạm Job Đua Thuyền TGHV</title><link rel="stylesheet" href="/style.css"></head><body><header><b>✿ Trạm Job Đua Thuyền TGHV</b><span id="who"></span></header><main><section id="auth" class="panel"><div class="tabs"><button onclick="tab('login')">Đăng nhập</button><button onclick="tab('register')">Đăng ký</button></div><form id="login"><h2>Đăng nhập</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button></form><form id="register" hidden><h2>Đăng ký thành viên</h2><input name="name" placeholder="Họ tên" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Số điện thoại"><input name="password" type="password" minlength="8" placeholder="Mật khẩu (ít nhất 8 ký tự)" required><button>Gửi đăng ký</button></form><p id="msg"></p></section><section id="app" hidden><nav><button onclick="page('home')">Tổng quan</button><button onclick="page('jobs')">Danh sách job</button><button id="membersNav" onclick="page('members')">Thành viên</button><button id="financeNav" onclick="page('finance')">Thu chi</button><button onclick="logout()">Đăng xuất</button></nav><div id="home" class="page"><h1>Tổng quan</h1><div id="stats" class="stats"></div></div><div id="jobs" class="page" hidden><h1>Danh sách job</h1><form id="jobForm" class="panel admin"><h3>Tạo job mới</h3><input name="code" placeholder="Mã job (bỏ trống để tự tạo)"><input name="customer" placeholder="Tên khách hàng" required><input name="contact" placeholder="Liên hệ khách hàng"><input name="red_flowers" type="number" min="0" placeholder="Số hoa đỏ"><input name="weekly_flowers" type="number" min="0" placeholder="Hoa tuần"><select name="pricing"><option>Hội roll + buff</option><option>Tự buff</option><option>Tự túc</option></select><input name="customer_price" type="number" min="0" placeholder="Giá khách trả"><input name="worker_pay" type="number" min="0" placeholder="Tiền trả người nhận"><textarea name="description" placeholder="Ghi chú"></textarea><button>Tạo job</button></form><div id="jobList"></div></div><div id="members" class="page" hidden><h1>Thành viên</h1><div id="memberList" class="panel"></div></div><div id="finance" class="page" hidden><h1>Thu chi</h1><form id="financeForm" class="panel"><select name="type"><option value="customer_payment">Khách thanh toán</option><option value="worker_payout">Trả người nhận job</option><option value="coordination_fee">Phí điều phối</option><option value="debt">Công nợ</option></select><input name="amount" type="number" min="1" placeholder="Số tiền" required><input name="job_id" type="number" placeholder="ID job (nếu có)"><input name="user_id" type="number" placeholder="ID thành viên (nếu có)"><input name="note" placeholder="Nội dung"><button>Lưu giao dịch</button></form><div id="financeList" class="panel"></div></div></section></main><script src="/app.js"></script></body></html>
